name: Bug report
description: Something in the pakistan-address or pakistan-address-react package doesn't work
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - pakistan-address
        - pakistan-address-react
        - Demo page
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.2.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps or code to reproduce
      render: tsx
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Node or browser, React version, bundler.
