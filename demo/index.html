<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pakistan-address demo</title>
<style>
  :root {
    --bg: #f7f8f7; --card: #fff; --text: #1a1f1c; --muted: #5b655f; --line: #d5dbd7; --accent: #01411c; --accent-text: #fff; --code: #eef1ef; --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111513; --card: #1a201d; --text: #e8ece9; --muted: #98a39c; --line: #2f3833; --accent: #4fa56c; --accent-text: #08130c; --code: #232b27; --warn: #f59e0b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .lede { color: var(--muted); margin: 0 0 16px; }
  .grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; align-items: start; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: 4px; }
  select, input, textarea { width: 100%; padding: 8px 10px; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
  input.other { margin-top: 6px; }
  select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  [hidden] { display: none !important; }
  pre { margin: 0; padding: 12px; background: var(--code); border-radius: 6px; overflow-x: auto; font-size: .8125rem; }
  .meta { color: var(--muted); font-size: .8125rem; margin-top: 24px; }
  .meta a { color: inherit; }
  .note { font-size: .8125rem; color: var(--muted); margin: 0 0 12px; }
  .switch { border: 0; padding: 0; margin: 0 0 16px; }
  .switch legend { font-size: .875rem; font-weight: 600; padding: 0; margin-bottom: 4px; }
  .switch label { display: inline-block; font-weight: 400; margin-right: 16px; }
  .switch input { width: auto; margin-right: 4px; }
  .notice { font-size: .8125rem; margin: 6px 0 0; padding: 8px 10px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; background: var(--code); }
  .notice.unofficial { border-left-color: var(--warn); margin: 0 0 12px; }

  /* searchable dropdown */
  .combo { position: relative; }
  .combo .control { position: relative; display: flex; }
  .combo input { padding-right: 52px; cursor: pointer; }
  .combo input:not([readonly]) { cursor: text; }
  .combo .clear { position: absolute; right: 26px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 2px 4px; }
  .combo .chev { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); font-size: .7rem; }
  .combo ul { position: absolute; z-index: 20; left: 0; right: 0; top: 100%; margin: 2px 0 0; padding: 0; list-style: none; max-height: 260px; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .combo li { padding: 7px 10px; cursor: pointer; }
  .combo li[aria-selected="true"] { font-weight: 600; }
  .combo li.active { background: var(--accent); color: var(--accent-text); }
  .combo li.pinned { border-top: 1px solid var(--line); }
  .combo li.empty { color: var(--muted); cursor: default; }
</style>
</head>
<body>
<main>
  <h1>pakistan-address</h1>
  <p class="lede" id="lede"></p>

  <fieldset class="switch">
    <legend>Address list</legend>
    <label><input type="radio" name="source" value="official" checked> Official administrative units</label>
    <label><input type="radio" name="source" value="delivery"> Delivery areas (unofficial)</label>
  </fieldset>

  <div class="grid">
    <section aria-labelledby="form-h">
      <h2 id="form-h">Address</h2>
      <p class="note">Open a list and type to search. Data is never complete, so each level can be typed in, and the full address is a separate field.</p>
      <p class="notice unofficial" id="source-notice" role="note" hidden></p>
      <form id="form" autocomplete="off"></form>
    </section>
    <section aria-labelledby="out-h">
      <h2 id="out-h">Resolved value</h2>
      <pre id="out" aria-live="polite"></pre>
    </section>
  </div>

  <p class="meta" id="meta"></p>
</main>

<script type="module">
import * as official from './pakistan-address.js';

const OTHER = '__other__';
const SEARCH_THRESHOLD = 10; // lists longer than this get a search box
const listed = (v) => v && v !== OTHER;
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const normalize = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

// ---- searchable dropdown (the same behaviour as the React Combobox) ------------------------------------------------
function createCombobox({ id, onChange }) {
  const root = document.createElement('div');
  root.className = 'combo';
  root.innerHTML = `<div class="control"><input id="${id}" type="text" role="combobox" autocomplete="off" spellcheck="false"
      aria-expanded="false" aria-controls="${id}-listbox"><button type="button" class="clear" tabindex="-1" aria-label="Clear" hidden>×</button>
      <span class="chev" aria-hidden="true">▾</span></div><ul id="${id}-listbox" role="listbox" hidden></ul>`;
  const input = root.querySelector('input');
  const clear = root.querySelector('.clear');
  const list = root.querySelector('ul');

  let options = []; // { id, name, altNames?, pinned? }
  let value = '';
  let open = false;
  let query = null;
  let active = 0;
  let searchable = false;

  const selected = () => options.find((o) => o.id === value);

  function shown() {
    const words = normalize(query || '').split(/\s+/).filter(Boolean);
    let base = options.filter((o) => !o.pinned);
    if (searchable && words.length) {
      base = base
        .map((o, index) => {
          const label = normalize(o.name);
          const hay = [label, ...(o.altNames || []).map(normalize)].join(' ');
          if (!words.every((w) => hay.includes(w))) return null;
          return { o, index, rank: label.startsWith(words[0]) ? 0 : label.includes(' ' + words[0]) ? 1 : 2 };
        })
        .filter(Boolean)
        .sort((a, b) => a.rank - b.rank || a.index - b.index)
        .map((x) => x.o);
    }
    return [...base, ...options.filter((o) => o.pinned)];
  }

  function paint() {
    input.setAttribute('aria-expanded', String(open));
    list.hidden = !open;
    input.value = searchable && open && query !== null ? query : selected()?.name || '';
    clear.hidden = !(value && selected());
    if (!open) return;
    const items = shown();
    if (active >= items.length) active = Math.max(items.length - 1, 0);
    const none = items.every((o) => o.pinned);
    list.innerHTML =
      (none ? '<li class="empty" role="option" aria-disabled="true" aria-selected="false">No matches</li>' : '') +
      items.map((o, i) => `<li role="option" id="${id}-opt-${i}" data-i="${i}" aria-selected="${o.id === value}"
        class="${i === active ? 'active' : ''}${o.pinned ? ' pinned' : ''}">${esc(o.name)}</li>`).join('');
    input.setAttribute('aria-activedescendant', items[active] ? `${id}-opt-${active}` : '');
    list.querySelector('.active')?.scrollIntoView({ block: 'nearest' });
  }

  function openList() {
    if (open) return;
    open = true;
    const at = shown().findIndex((o) => o.id === value);
    active = at >= 0 ? at : 0;
    paint();
  }
  function close() { open = false; query = null; paint(); }
  function choose(opt) { value = opt.id; close(); onChange(value); input.focus(); }

  input.addEventListener('click', () => (open ? close() : openList()));
  input.addEventListener('input', () => { query = input.value; active = 0; open = true; paint(); });
  input.addEventListener('blur', close);
  input.addEventListener('keydown', (e) => {
    const items = shown();
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) openList(); else { active = Math.min(active + 1, items.length - 1); paint(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (!open) openList(); else { active = Math.max(active - 1, 0); paint(); } }
    else if (e.key === 'Enter' && open && items[active]) { e.preventDefault(); choose(items[active]); }
    else if (e.key === ' ' && !searchable) { e.preventDefault(); open && items[active] ? choose(items[active]) : openList(); }
    else if (e.key === 'Escape' && open) { e.preventDefault(); close(); }
    else if (e.key === 'Tab') close();
  });
  list.addEventListener('mousedown', (e) => e.preventDefault()); // keep focus in the input
  list.addEventListener('click', (e) => {
    const li = e.target.closest('li[data-i]');
    if (li) choose(shown()[Number(li.dataset.i)]);
  });
  list.addEventListener('mousemove', (e) => {
    const li = e.target.closest('li[data-i]');
    if (li && Number(li.dataset.i) !== active) { active = Number(li.dataset.i); paint(); }
  });
  clear.addEventListener('mousedown', (e) => e.preventDefault());
  clear.addEventListener('click', () => { value = ''; close(); onChange(''); input.focus(); });

  return {
    root,
    input,
    // `items` are records ({ id, name, altNames? }); `withOther` adds the pinned "Other / not listed" entry.
    setOptions(items, current, withOther, placeholder) {
      options = items.map((o) => ({ id: o.id, name: o.name, altNames: o.altNames }));
      if (withOther) options.push({ id: OTHER, name: 'Other / not listed', pinned: true });
      value = current || '';
      query = null;
      open = false;
      searchable = items.length > SEARCH_THRESHOLD;
      input.readOnly = !searchable;
      input.placeholder = searchable ? 'Select or type to search…' : placeholder;
      clear.setAttribute('aria-label', 'Clear');
      paint();
    },
  };
}

// ---- the two address lists ----------------------------------------------------------------------------------------
// Each source describes its levels and how to work out what is visible and what each list contains.
const SOURCES = {
  official: {
    lede: 'Province → Division → District → Tehsil, with an "Other / not listed" fallback at every level.',
    levels: [
      { key: 'province', label: 'Province' },
      { key: 'division', label: 'Division' },
      { key: 'district', label: 'District' },
      { key: 'tehsil', label: 'Tehsil' },
    ],
    api: () => official,
    compute(api, ids) {
      const divisions = listed(ids.province) ? api.getDivisions(ids.province) : [];
      const hasDivisions = divisions.length > 0;
      const districts = listed(ids.division) ? api.getDistricts(ids.division)
        : ids.province && listed(ids.province) && (!hasDivisions || ids.division === OTHER) ? api.getDistrictsByProvince(ids.province) : [];
      const tehsils = listed(ids.district) ? api.getTehsils(ids.district) : [];
      const reachDistricts = !!ids.province && (!hasDivisions || !!ids.division);
      return {
        visible: { province: true, division: hasDivisions, district: reachDistricts, tehsil: reachDistricts && !!ids.district },
        options: { province: api.getProvinces(), division: divisions, district: districts, tehsil: tehsils },
        textWhenEmpty: { tehsil: true },
      };
    },
    lookup: (api) => ({ province: api.getProvince, division: api.getDivision, district: api.getDistrict, tehsil: api.getTehsil }),
    provinceNotice: (api, ids) => (listed(ids.province) ? api.getProvince(ids.province)?.notice : ''),
    meta(api) {
      const m = api.getMeta();
      return `Data version ${m.dataVersion} · ${esc(m.baseline)} · ` + m.sources.map((s) => `<a href="${s.url}">${esc(s.name)}</a>`).join(', ') +
        ' · boundaries change and this data is not yet verified against official lists; see DATA.md.';
    },
  },
  delivery: {
    lede: "Province → City → Area → Zone: delivery places taken from an online store's address form (the area step only for big cities). Unofficial.",
    levels: [
      { key: 'province', label: 'Province' },
      { key: 'city', label: 'City' },
      { key: 'area', label: 'Area' },
      { key: 'zone', label: 'Zone / neighbourhood' },
    ],
    load: () => import('./pakistan-address-delivery.js'),
    compute(api, ids) {
      const cities = listed(ids.province) ? api.getDeliveryCities(ids.province) : [];
      const areas = listed(ids.city) ? api.getDeliveryAreas(ids.city) : [];
      const cityHasAreas = areas.length > 0;
      // Zones hang off the area when the city has areas, otherwise off the city.
      const zoneParent = cityHasAreas ? (listed(ids.area) ? ids.area : '') : (listed(ids.city) ? ids.city : '');
      const zones = zoneParent ? api.getDeliveryZones(zoneParent) : [];
      const reachCities = listed(ids.province);
      return {
        visible: {
          province: true,
          city: reachCities,
          area: reachCities && cityHasAreas,
          zone: cityHasAreas ? !!ids.area : reachCities && !!ids.city,
        },
        options: { province: api.getDeliveryProvinces(), city: cities, area: areas, zone: zones },
        textWhenEmpty: { zone: true },
      };
    },
    lookup: (api) => ({ province: api.getDeliveryProvince, city: api.getDeliveryCity, area: api.getDeliveryArea, zone: api.getDeliveryZone }),
    meta(api) {
      const m = api.getDeliveryMeta();
      return `${esc(m.label)} · collected ${esc(m.source.collected)} · ${esc(m.description)}`;
    },
  },
};

const form = document.getElementById('form');
const out = document.getElementById('out');
const notice = document.getElementById('source-notice');
const cache = {};
let current, api, ids, text, addressLine, els;

async function useSource(name) {
  const src = SOURCES[name];
  if (src.load && !cache[name]) {
    document.getElementById('meta').textContent = 'Loading…';
    cache[name] = await src.load();
  }
  api = src.api ? src.api() : cache[name];
  current = { name, ...src };
  ids = Object.fromEntries(src.levels.map((l) => [l.key, '']));
  text = Object.fromEntries(src.levels.map((l) => [l.key, '']));
  addressLine = '';
  document.getElementById('lede').textContent = src.lede;
  notice.hidden = name === 'official';
  notice.textContent = name === 'official' ? '' : 'Unofficial list. These are courier delivery areas taken from an online store, not administrative units, and may be incomplete or out of date.';
  document.getElementById('meta').innerHTML = src.meta(api);
  buildForm();
  render(true);
}

function buildForm() {
  form.innerHTML = '';
  els = {};
  for (const { key, label } of current.levels) {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    wrap.innerHTML = `<label for="${key}">${label}</label>` +
      (key === 'province' ? '<p class="notice" id="province-notice" role="note" hidden></p>'
        : `<input class="other" id="${key}-text" type="text" placeholder="Type your ${label.toLowerCase()}" aria-label="${label} (not listed)" hidden>`);
    const combo = createCombobox({ id: key, onChange: (v) => choose(key, v) });
    wrap.querySelector('label').after(combo.root);
    form.append(wrap);
    els[key] = { wrap, combo, text: wrap.querySelector('input.other') };
    els[key].text?.addEventListener('input', (e) => { text[key] = e.target.value; render(false); });
  }
  const addr = document.createElement('div');
  addr.className = 'field';
  addr.innerHTML = '<label for="line">Full address / landmark</label><textarea id="line" rows="3" placeholder="House, street, nearby landmark"></textarea>';
  form.append(addr);
  addr.querySelector('textarea').addEventListener('input', (e) => { addressLine = e.target.value; render(false); });
}

function choose(key, value) {
  const keys = current.levels.map((l) => l.key);
  ids[key] = value;
  for (const lower of keys.slice(keys.indexOf(key) + 1)) { ids[lower] = ''; text[lower] = ''; }
  text[key] = '';
  render(true);
}

function render(rebuildLists) {
  const { visible, options, textWhenEmpty } = current.compute(api, ids);
  const pn = document.getElementById('province-notice');
  const pnText = current.provinceNotice ? current.provinceNotice(api, ids) : '';
  pn.textContent = pnText || '';
  pn.hidden = !pnText;
  for (const { key } of current.levels) {
    const { wrap, combo, text: input } = els[key];
    wrap.hidden = !visible[key];
    const list = options[key];
    const hasList = list.length > 0;
    combo.root.hidden = !hasList;
    if (rebuildLists) combo.setOptions(list, ids[key], key !== 'province' && hasList, 'Select…');
    if (input) {
      input.hidden = !(visible[key] && (ids[key] === OTHER || (textWhenEmpty?.[key] && !hasList)));
      if (rebuildLists) input.value = text[key];
    }
  }
  const lookup = current.lookup(api);
  const name = (key) => (listed(ids[key]) ? (lookup[key](ids[key])?.name ?? '') : (text[key] || '').trim());
  out.textContent = JSON.stringify({
    source: current.name,
    ...Object.fromEntries(current.levels.map((l) => [l.key, name(l.key)])),
    addressLine: addressLine.trim(),
    ids: Object.fromEntries(current.levels.map((l) => [l.key, listed(ids[l.key]) ? ids[l.key] : null])),
  }, null, 2);
}

for (const radio of document.querySelectorAll('input[name="source"]')) {
  radio.addEventListener('change', (e) => useSource(e.target.value));
}
useSource('official');
</script>
</body>
</html>
